name: Android release build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build Android release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Prepare verified attribution asset
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_assets.py

      - name: Assemble release variant
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew assembleRelease --no-daemon --no-parallel --console=plain

      - name: Package and optionally sign APK
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/package_release.py \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --output-dir artifacts

      - name: Write public build summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          info = json.loads(Path("artifacts/build-info.json").read_text(encoding="utf-8"))
          signed = info["signed"]
          lines = [
              "## Android release APK",
              "",
              f"- Package: `{info['applicationId']}`",
              f"- Version: `{info['versionName']}` (code `{info['versionCode']}`)",
              f"- Commit: `{info['commitSHA']}`",
              f"- Signing: `{ 'signed' if signed else 'unsigned' }`",
          ]
          if not signed:
              lines += ["", "**This unsigned APK cannot be installed as a release build. Configure all four release signing secrets to produce an installable APK.**"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Upload APK and metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: heyread-release-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14

      - name: Check for R8 mapping
        id: mapping
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/build/outputs/mapping/release/mapping.txt ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload R8 mapping
        if: always() && steps.mapping.outputs.exists == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: heyread-r8-mapping-${{ github.sha }}-${{ github.run_attempt }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
